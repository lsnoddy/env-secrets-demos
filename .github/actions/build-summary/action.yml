name: Build summary
description: Prints a build banner and writes a job summary in one step

inputs:
  app-name:
    description: Name to show in the banner
    required: true

outputs:
  summary-line:
    description: The line written to the job summary
    value: ${{ steps.summary.outputs.line }}

runs:
  using: composite
  steps:
    - name: Print a banner
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
      run: echo "=== Building $APP_NAME on $RUNNER_OS ==="

    - name: Write the job summary
      id: summary
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
      run: |
        line="$APP_NAME built from ${GITHUB_SHA::7} in run #$GITHUB_RUN_NUMBER"
        echo "### $line" >> "$GITHUB_STEP_SUMMARY"
        echo "line=$line" >> "$GITHUB_OUTPUT"
