name: Demo 3 - Secrets and variables

on:
  workflow_dispatch:

jobs:
  no-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Read config and secret
        env:
          API_URL: ${{ vars.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "API_URL = $API_URL"
          echo "API_KEY = $API_KEY"
          echo "API_KEY starts with: ${API_KEY:0:4}"

  with-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      deployment: false
    steps:
      - name: Read config and secret
        env:
          API_URL: ${{ vars.API_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          echo "API_URL = $API_URL"
          echo "API_KEY = $API_KEY"
          echo "API_KEY starts with: ${API_KEY:0:4}"
